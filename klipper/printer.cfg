# IDEX VORON TRIDEX 400x400x400 - REV.3.2-RC1 (DRAFT)
# СТАТУС: ЧЕРНОВИК ДЛЯ СТЕНДОВОЙ ПРОВЕРКИ. Все [ПРОВЕРИТЬ] - замерить по железу!
[mcu]
canbus_uuid: <REPLACE_WITH_OCTOPUS_UUID>
[mcu ebb0]
canbus_uuid: <REPLACE_WITH_EBB0_T0_UUID>
[mcu ebb1]
canbus_uuid: <REPLACE_WITH_EBB1_T1_UUID>
[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 5000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 40
endstop_pin: ^ebb0:PB6
position_min: -70
position_endstop: -68
position_max: 403
homing_speed: 60
[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.90
stealthchop_threshold: 0
[dual_carriage]
axis: x
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 40
endstop_pin: ^ebb1:PB6
position_min: -3
position_endstop: 468
position_max: 470
homing_speed: 60
safe_distance: 65
[tmc2209 dual_carriage]
uart_pin: PD11
run_current: 0.90
stealthchop_threshold: 0
[stepper_y]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 32
rotation_distance: 40
endstop_pin: ^PG10              # [ПРОВЕРИТЬ] выключатель между сигналом и GND; иначе сверить схему
position_min: 0
position_endstop: 405
position_max: 405
homing_speed: 60
[tmc2209 stepper_y]
uart_pin: PC6
run_current: 0.95
stealthchop_threshold: 0
[stepper_y1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
microsteps: 32
rotation_distance: 40
endstop_pin: ^PG11              # [ПРОВЕРИТЬ] выключатель между сигналом и GND; иначе сверить схему
[tmc2209 stepper_y1]
uart_pin: PC7
run_current: 0.95
stealthchop_threshold: 0
[stepper_z]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 400
homing_speed: 10
[tmc2209 stepper_z]
uart_pin: PF2
run_current: 0.80
[stepper_z1]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 2
[tmc2209 stepper_z1]
uart_pin: PE4
run_current: 0.80
[stepper_z2]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 2
[tmc2209 stepper_z2]
uart_pin: PE1
run_current: 0.80
[extruder]
step_pin: ebb0:PD0
dir_pin: ebb0:PD1
enable_pin: !ebb0:PD2
microsteps: 16
rotation_distance: 25.08
gear_ratio: 44:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb0:PB13
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: ebb0:PA3
min_temp: 0
max_temp: 355
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
[tmc2209 extruder]
uart_pin: ebb0:PA15
run_current: 0.55
[heater_fan hotend_fan0]
pin: ebb0:PA0
heater: extruder
heater_temp: 50.0
[fan]
pin: ebb0:PA1
[extruder1]
step_pin: ebb1:PD0
dir_pin: ebb1:PD1
enable_pin: !ebb1:PD2
microsteps: 16
rotation_distance: 25.08
gear_ratio: 44:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: ebb1:PB13
sensor_type: PT1000
pullup_resistor: 2200
sensor_pin: ebb1:PA3
min_temp: 0
max_temp: 355
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
[tmc2209 extruder1]
uart_pin: ebb1:PA15
run_current: 0.55
[heater_fan hotend_fan1]
pin: ebb1:PA0
heater: extruder1
heater_temp: 50.0
[fan_generic fan1]
pin: ebb1:PA1
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
pwm_cycle_time: 0.3
max_power: 0.85
min_temp: 0
max_temp: 125
control: pid
pid_Kp: 54.0
pid_Ki: 0.77
pid_Kd: 948
# Вариант ниже — обычный выключатель/совместимый датчик на PB8 (например, Klicky).
# BLTouch НЕ настраивается секцией [probe]: для него нужна [bltouch] с sensor_pin PB8 и control_pin PB9.
# Для индуктивного датчика на PB5 проверить тип выхода, полярность и схему подключения.
[probe]
pin: ^ebb0:PB8                 # [ПРОВЕРИТЬ] оставить только если выбранный датчик действительно подключён к PB8
x_offset: 0
y_offset: 25
z_offset: 0.0
[safe_z_home]
home_xy_position: 200, 200
z_hop: 10
z_hop_speed: 10
speed: 100
[z_tilt]
z_positions:
    -30, 15
    200, 425
    430, 15
points:
    30, 30
    200, 370
    370, 30
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01
[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 20, 30
mesh_max: 380, 380
probe_count: 7, 7
algorithm: bicubic
[idle_timeout]
timeout: 1800
gcode:
    TURN_OFF_HEATERS
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=dual_carriage ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y1 ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=0
[gcode_macro _IDEX_OFFSET]
variable_x: 0.0
variable_y: 0.0
variable_z: 0.0
gcode:
[gcode_macro IDEX_INIT]
description: Безопасная парковка обеих кареток с проверкой 2 мм Z-hop и согласованием координат
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
        {action_raise_error("IDEX_INIT: сначала выполните G28 и убедитесь, что XYZ homed")}
    {% else %}
        {% set z_max = printer.toolhead.axis_maximum.z|float %}
        {% set z_cur = printer.toolhead.position.z|float %}
        {% if (z_max - z_cur) < 2.0 %}
            {action_raise_error("IDEX_INIT: недостаточно запаса хода по Z для безопасного Z-hop 2.0 мм")}
        {% else %}
            {% set orig_ext = printer.toolhead.extruder %}
            {% set off = printer["gcode_macro _IDEX_OFFSET"] %}
            G91
            G1 Z2.0 F600
            G90
            {% if orig_ext == "extruder1" %}
                _PARK X=468
                ACTIVATE_EXTRUDER EXTRUDER=extruder
                SET_DUAL_CARRIAGE CARRIAGE=0
                SET_GCODE_OFFSET X=0 Y=0
                _PARK X=-68
                ACTIVATE_EXTRUDER EXTRUDER=extruder1
                SET_DUAL_CARRIAGE CARRIAGE=1
                SET_GCODE_OFFSET X={off.x} Y={off.y}
            {% else %}
                _PARK X=-68
                ACTIVATE_EXTRUDER EXTRUDER=extruder1
                SET_DUAL_CARRIAGE CARRIAGE=1
                SET_GCODE_OFFSET X={off.x} Y={off.y}
                _PARK X=468
                ACTIVATE_EXTRUDER EXTRUDER=extruder
                SET_DUAL_CARRIAGE CARRIAGE=0
                SET_GCODE_OFFSET X=0 Y=0
            {% endif %}
            G91
            G1 Z-2.0 F600
            G90
        {% endif %}
    {% endif %}

[gcode_macro _PARK]
description: Защищенная парковка активной каретки в док без обратного возврата
gcode:
    {% set homed = printer.toolhead.homed_axes %}
    {% if 'x' not in homed or 'y' not in homed %}
        {action_raise_error("_PARK: оси X и Y должны быть отхоумлены перед парковкой")}
    {% elif params.X is not defined %}
        {action_raise_error("_PARK: не задан обязательный параметр X")}
    {% else %}
        {% set x = params.X|float %}
        {% set y = 380.0 %}
        {% set x_min = printer.toolhead.axis_minimum.x|float %}
        {% set x_max = printer.toolhead.axis_maximum.x|float %}
        {% set y_min = printer.toolhead.axis_minimum.y|float %}
        {% set y_max = printer.toolhead.axis_maximum.y|float %}
        {% if x < x_min or x > x_max %}
            {action_raise_error("_PARK: координата X=%.2f выходит за пределы [%.2f..%.2f]" % (x, x_min, x_max))}
        {% elif y < y_min or y > y_max %}
            {action_raise_error("_PARK: координата Y=%.2f выходит за пределы [%.2f..%.2f]" % (y, y_min, y_max))}
        {% else %}
            SAVE_GCODE_STATE NAME=park
            G90
            G1 Y{y} F12000
            G1 X{x} F12000
            RESTORE_GCODE_STATE NAME=park MOVE=0
        {% endif %}
    {% endif %}
[gcode_macro T0]
description: Переключение на левую каретку T0 с проверкой homing и Z
gcode:
    {% if printer.toolhead.extruder == "extruder1" %}
        {% set homed = printer.toolhead.homed_axes %}
        {% set z = printer.toolhead.position.z|float %}
        {% set zmax = printer.toolhead.axis_maximum.z|float %}
        {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
            {action_raise_error("T0: перед переключением должны быть homed X, Y и Z")}
        {% elif z + 2.0 > zmax %}
            {action_raise_error("T0: нет безопасного запаса 2 мм для подъёма Z")}
        {% else %}
            G91
            G1 Z2 F600
            G90
            _PARK X=468
            ACTIVATE_EXTRUDER EXTRUDER=extruder
            SET_DUAL_CARRIAGE CARRIAGE=0
            {% set off = printer["gcode_macro _IDEX_OFFSET"] %}
            SET_GCODE_OFFSET X=0 Y=0 Z_ADJUST={-off.z} MOVE=0
            G91
            G1 Z-2 F600
            G90
        {% endif %}
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        SET_DUAL_CARRIAGE CARRIAGE=0
    {% endif %}
[gcode_macro T1]
description: Переключение на правую каретку T1 с проверкой homing и Z
gcode:
    {% if printer.toolhead.extruder == "extruder" %}
        {% set homed = printer.toolhead.homed_axes %}
        {% set z = printer.toolhead.position.z|float %}
        {% set zmax = printer.toolhead.axis_maximum.z|float %}
        {% if 'x' not in homed or 'y' not in homed or 'z' not in homed %}
            {action_raise_error("T1: перед переключением должны быть homed X, Y и Z")}
        {% elif z + 2.0 > zmax %}
            {action_raise_error("T1: нет безопасного запаса 2 мм для подъёма Z")}
        {% else %}
            G91
            G1 Z2 F600
            G90
            _PARK X=-68
            ACTIVATE_EXTRUDER EXTRUDER=extruder1
            SET_DUAL_CARRIAGE CARRIAGE=1
            {% set off = printer["gcode_macro _IDEX_OFFSET"] %}
            SET_GCODE_OFFSET X={off.x} Y={off.y} Z_ADJUST={off.z} MOVE=0
            G91
            G1 Z-2 F600
            G90
        {% endif %}
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        SET_DUAL_CARRIAGE CARRIAGE=1
    {% endif %}
[gcode_macro M106]
rename_existing: M106.1
gcode:
    {% set s = params.S|default(255)|float %}
    {% if params.P is defined %}
        {% if params.P|int == 0 %}
            M106.1 S{s}
        {% elif params.P|int == 1 %}
            SET_FAN_SPEED FAN=fan1 SPEED={s/255.0}
        {% endif %}
    {% elif printer.toolhead.extruder == "extruder1" %}
        SET_FAN_SPEED FAN=fan1 SPEED={s/255.0}
    {% else %}
        M106.1 S{s}
    {% endif %}
[gcode_macro M107]
rename_existing: M107.1
gcode:
    {% if params.P is defined %}
        M106 P{params.P} S0
    {% else %}
        M107.1
        SET_FAN_SPEED FAN=fan1 SPEED=0
    {% endif %}